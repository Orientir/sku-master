name: Windows release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and test
        shell: pwsh
        run: ./scripts/build.ps1

  release:
    needs: verify
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: windows-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Determine release version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if ($event.repository.private) { throw 'Public releases are required for token-free desktop updates.' }
          [xml]$props = Get-Content Directory.Build.props -Raw
          $version = [string]$props.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Version must use MAJOR.MINOR.PATCH.' }
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Tag does not match Directory.Build.props.' }
          $releases = gh release list --repo $env:RELEASE_REPOSITORY --limit 1000 --json tagName,isDraft
          if ($LASTEXITCODE -ne 0) { throw 'Unable to check existing releases.' }
          $existing = @($releases | ConvertFrom-Json) | Where-Object tagName -eq $tag
          $publish = if ($existing -and !$existing.isDraft) { 'false' } else { 'true' }
          if ($publish -eq 'false') { Write-Output "Release $tag is already published. Increase Version to release new code." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT
      - name: Package installer and update feed
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/package.ps1 -Version $env:RELEASE_VERSION -RepositoryUrl "https://github.com/$env:RELEASE_REPOSITORY"
      - name: Publish complete release
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/publish-release.ps1 -Version $env:RELEASE_VERSION -Repository $env:RELEASE_REPOSITORY -Commit $env:GITHUB_SHA
